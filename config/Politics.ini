; SC4 Politics configuration. Place next to the plugin DLL in your Plugins folder.
[Server]
; Local port for the web view: open http://127.0.0.1:9031/ in a browser while playing.
Port=9031

[Council]
Seats=25
; 1 = each party's score is a weighted AVERAGE of its traits (recommended; stops
; New Liberal winning just because it lists 11 traits). 0 = plain weighted sum.
NormalizeByWeight=1

[Weights]
; Format: <PARTY>.<Trait>=<weight>. Weight = number of '+' in the design spec; 0 disables.
; Parties: DPP GAP NLP CRP NPP
; Traits : LowDensity MedDensity HighDensity MidIncome HighIncome HighEducation
;          Age11_20 Age21_30 Age11_30 Age31_50 Age51_60 Age61_90 R1 R2 R3 CO2 IHT ID IAg
; Defaults already match the spec. Example override:
; CRP.Age61_90=3

[Assumed]
; SimCity 4 does not report how many residents are in each age bracket, so these
; shares (percent of residents) are ASSUMED and are the same in every city. Edit to taste.
; HighEducation is only a fallback if the game's education value cannot be read.
Age11_20=15
Age21_30=15
Age31_50=35
Age51_60=15
Age61_90=20
HighEducation=30
